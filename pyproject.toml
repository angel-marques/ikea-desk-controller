[project]
name = "idasen-controller"
version = "0.1.0"
description = "Control IKEA IDÅSEN standing desk from macOS via Bluetooth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=2.1.1",
    "customtkinter>=5.2.2",
]

[project.scripts]
desk = "idasen_controller:main"
desk-gui = "desk_gui:main"

[tool.setuptools]
py-modules = ["idasen_controller", "desk_gui"]
